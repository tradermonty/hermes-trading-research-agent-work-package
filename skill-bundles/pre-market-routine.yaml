instruction: |
  Run the pre-market routine for US equities.

  Produce a concise research brief in watchlist and research language; entries and exits remain with the human reviewer (see SOUL.md).

  Required sections:
  1. Market posture: risk-on / neutral / risk-off, with reason.
  2. Macro calendar: high-impact events today and this week.
  3. Earnings movers: large reactions and PEAD/watchlist candidates.
  4. Breadth and uptrend participation.
  5. Sectors/themes worth watching.
  6. Watchlist candidates with thesis, invalidation, and required follow-up.
  7. Risk gate: full risk / reduced risk / no new trades.
  8. Data freshness and missing-data warnings.

  Session state and posture basis (mandatory two-line preamble to any risk-posture statement):

  - Session state: state today's date relative to the US cash market in one of: "normal session day", "US market holiday", "weekend", "unknown". This is a calendar fact about today, not a regime label.
  - Posture basis: state the latest completed regular-session close used for the posture, with the date, and label the relationship in one of three forms:
    - "based on fresh latest completed regular-session close" — the expected most recent regular-session close is available with no holiday/weekend bridge (e.g. a normal Tuesday pre-market run where Monday's close is the basis). Unfinished intraday or pre-market data is described separately from completed-close posture, not collapsed into this label.
    - "carried forward from <YYYY-MM-DD>" — the close used is calendar-old only because today follows a weekend or market holiday (e.g. a Tuesday pre-market run after a Monday holiday where the basis is the prior Friday's close). State explicitly that the posture is propagated from the most recent completed session rather than presented as a fresh regime change. This label is not mutually exclusive with the underlying truth that the close itself is the latest completed regular-session close — use this label whenever a holiday/weekend bridge sits between today and that close, so the operator does not read a structural regime change into a calendar gap.
    - "pending fresh data / degraded" — used only when the latest usable close is older than the previous regular cash-market session, or when a required data source is missing. In every other case prefer one of the two labels above.

  Render these two lines before any "Risk posture:" / "REDUCE_ONLY" / "exposure ceiling" statement so that the operator reads the state and the basis before the conclusion.

  Source / Skill provenance: within section 8 (Data freshness and missing-data warnings), render an explicit "Source / Skill provenance" sub-heading that lists which skill or data source produced each non-trivial item in the brief. Listing skills implicitly inside an unrelated section reduces operator traceability — give it its own sub-heading under section 8.

  Watchlist candidates ready for confirmation can be escalated to `/trade-ticket`. Include `source_bundle: pre-market-routine` and a stable `source_candidate_ref` (e.g. `<TICKER>-<YYYY-MM-DD>-<setup>`) so the ticket can populate its provenance field.

  Input provenance contract (morning and evening briefs):

  - In the data-freshness section, render `### Source / Skill provenance` and this table, with one row per input used or attempted, including missing inputs:
    | Input / section | Source / Skill | Skill revision | Observation date | Expected observation date | Status | Impact / next step |
    |---|---|---|---|---|---|---|
  - Source / Skill identifies the actual provider or artifact and consuming skill. For `uptrend-analyzer`, show `Finviz -> uptrend-dashboard CSV -> uptrend-analyzer`; no local key is required, but this is still an upstream Finviz dependency. Record the actual external skill checkout commit (and dirty state), or `unknown` if unverifiable. A configured key or successful download establishes neither revision nor freshness. Use redacted source identifiers without authentication query strings or secrets.
  - Observation date is the underlying data's session/as-of date in `YYYY-MM-DD`, never the download time, report-generation time, or filename date. Expected observation date is the latest observation due under that input's publication schedule and the verified US market calendar. Use `unknown` for an unverified date, including undated sector/industry rows; assess each input separately rather than borrowing a newer overall dashboard date.
  - Status is exactly one of `fresh`, `carried_forward`, `stale`, `unavailable`, `valid_empty`, `unknown`. `fresh` means the expected observation is present. `carried_forward` means the expected latest completed session is present across a holiday/weekend bridge, preserving the existing posture-basis wording. `stale` means the observed session predates the expected session. For after-close, today's completed close is expected only after its publication is due; on holidays/weekends use the latest completed session. State the calendar/publication basis in Impact / next step; if it cannot be verified use `unknown` and degraded mode.
  - `unavailable` means a missing key/skill, failed request, authentication/HTTP error, invalid CSV or missing required columns; it is never a zero-candidate result. `valid_empty` means a successful, schema-validated screen returned 0 rows for the expected observation date; state `0 validated rows`. With unverified observation metadata use `unknown` instead. An empty response body or login HTML is unavailable, not valid_empty. A stale empty screen is stale.
  - In each affected report section, repeat the input's status and observation date; explain the missing/stale input and its impact plus a recovery/setup step. Preserve independently available data with its own provenance. Restrict conclusions dependent on stale/unavailable/unknown inputs to research-only or pending confirmation; missing breadth data establishes no fresh regime change. Preserve thesis, invalidation, risk notes and the human decision gate.
  - The table can be checked offline with `python3 scripts/validate_brief_provenance.py <brief.md>` from the installed profile root. This checks declared fields/date consistency only; source truth, calendar choice, completeness and dependent conclusions still require human review.

  Output must always include:
  - data freshness (as-of timestamps for each input and any stale data warnings)
  - source provenance for each data point (which skill or data source produced it)
  - thesis behind each watchlist or candidate item
  - invalidation criteria for each thesis
  - risk considerations (exposure impact, drawdown sensitivity, event risk)
  - a human decision gate — the human reviewer makes all entry and exit decisions; this bundle does not place orders
