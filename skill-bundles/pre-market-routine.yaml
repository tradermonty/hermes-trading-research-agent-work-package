instruction: |
  Run the pre-market routine for US equities.

  Produce a concise research brief in watchlist and research language; entries and exits remain with the human reviewer (see SOUL.md).

  Required sections:
  1. Market posture: risk-on / neutral / risk-off, with reason.
  2. Macro calendar: high-impact events today and this week.
  3. Earnings movers: large reactions and PEAD/watchlist candidates.
  4. Breadth and uptrend participation.
  5. Sectors/themes worth watching.
  6. Watchlist candidates with thesis, invalidation, and required follow-up.
  7. Risk gate: full risk / reduced risk / no new trades.
  8. Data freshness and missing-data warnings.

  Output must always include:
  - data freshness (as-of timestamps for each input and any stale data warnings)
  - source provenance for each data point (which skill or data source produced it)
  - thesis behind each watchlist or candidate item
  - invalidation criteria for each thesis
  - risk considerations (exposure impact, drawdown sensitivity, event risk)
  - a human decision gate — the human reviewer makes all entry and exit decisions; this bundle does not place orders
