schema_version: 1

providers:
  fmp:
    env_var: FMP_API_KEY
    label: Financial Modeling Prep
    requirement_level: optional_global_required_for_many_skills
    skills:
      - earnings-calendar
      - earnings-trade-analyzer
      - economic-calendar-fetcher
      - ftd-detector
      - ibd-distribution-day-monitor
      - pead-screener
      - vcp-screener
      - canslim-screener
      - value-dividend-screener
      - pair-trade-screener
      - institutional-flow-tracker
  finviz:
    env_var: FINVIZ_API_KEY
    label: FINVIZ Elite
    requirement_level: optional_recommended_for_screeners
    skills:
      - finviz-screener
      - theme-detector
      - dividend-growth-pullback-screener
      - value-dividend-screener
  alpaca:
    env_vars:
      - ALPACA_API_KEY
      - ALPACA_SECRET_KEY
      - ALPACA_PAPER
    label: Alpaca paper/read-only
    requirement_level: optional_portfolio_and_account_context
    default_mode: paper_read_only
    skills:
      - portfolio-manager
      - parabolic-short-trade-planner

# Local credential requirements only; not a guarantee of independent or fresh data.
# See input_provenance and docs/04-skill-integration-strategy.md.
no_key_or_local_data:
  - market-breadth-analyzer
  - uptrend-analyzer
  - exposure-coach
  - position-sizer
  - signal-postmortem
  - trader-memory-core
  - trading-skills-navigator

# Separate data lineage from credentials required on this machine.
input_provenance:
  uptrend-analyzer:
    local_key_required: false
    source_chain:
      - Finviz collection upstream
      - tradermonty/uptrend-dashboard published CSV
      - uptrend-analyzer
    freshness_basis: underlying per-input session date, not fetch time
    missing_observation_date: unknown_degraded
    stale_observation: affected_section_degraded
  elite_screens:
    skills:
      - theme-detector
      - value-dividend-screener
      - dividend-growth-pullback-screener
    source_chain:
      - FINVIZ Elite screener export
      - external skill checkout
    revision_evidence: actual checkout commit and dirty state, or unknown
    valid_empty_requires: successful schema-validated screen with expected observation date
    transition_guidance: docs/04-skill-integration-strategy.md
