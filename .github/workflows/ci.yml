name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v6

      # Upstream skills repo cloned into the workspace (GitHub Actions does not
      # allow writes outside $GITHUB_WORKSPACE). The validator only reads
      # `skills-index.yaml` and `skills/*/SKILL.md`, so no auth is required.
      - name: Checkout claude-trading-skills (default branch)
        uses: actions/checkout@v6
        with:
          repository: tradermonty/claude-trading-skills
          path: claude-trading-skills

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Validate package structure
        run: make validate

      - name: Validate upstream skill references
        env:
          CLAUDE_TRADING_SKILLS_REPO: ${{ github.workspace }}/claude-trading-skills
        run: make validate-upstream

      - name: Run tests
        run: make test
