[project]
name = "hermes-trading-research-agent"
version = "0.1.5"
description = "Hermes profile distribution scaffold for Claude Trading Skills based trading research workflows."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "jsonschema>=4.22.0",
]

# This repo is a Hermes profile distribution, not a Python package. We keep a
# pyproject.toml only to declare dev deps (`pip install -e ".[dev]"`) and to
# configure pytest. Tell setuptools explicitly that there are no importable
# packages or modules so it stops trying to auto-discover top-level dirs like
# `cron/`, `data/`, `skills/`, `schemas/`, `prompts/` (which would otherwise
# break flat-layout auto-discovery and abort the install).
[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
