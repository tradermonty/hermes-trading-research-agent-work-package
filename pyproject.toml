[project]
name = "hermes-trading-research-agent"
version = "0.1.0"
description = "Hermes profile distribution scaffold for Claude Trading Skills based trading research workflows."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "jsonschema>=4.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
