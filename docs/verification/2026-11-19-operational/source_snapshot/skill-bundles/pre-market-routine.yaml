name: pre-market-routine
description: 'US equity pre-market brief: macro calendar, earnings movers, breadth,
  regime, themes, candidates, and risk gate.'
x-generated: false
skills:
- trading-research-orchestrator
- trading-cron-brief-writer
- trading-skills-navigator
- economic-calendar-fetcher
- earnings-calendar
- market-breadth-analyzer
- uptrend-analyzer
- market-top-detector
- ibd-distribution-day-monitor
- exposure-coach
